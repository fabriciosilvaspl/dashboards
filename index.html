<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhamento Repasses — Acqua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://alcdn.msauth.net/browser/3.18.0/js/msal-browser.min.js"></script>
<style>
  :root{
    --navy:#1F3864; --navy-deep:#132745; --rust:#C55A11; --rust-light:#FCE4D6;
    --green:#4C7A3D; --green-light:#E7F0E3; --red:#B23A2E; --red-light:#FBE7E4;
    --paper:#F3F5F8; --card:#FFFFFF; --line:#DFE4EA; --ink:#1B2430; --ink-soft:#5B6472; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }

  header.top{
    position:sticky; top:0; z-index:20;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 22px),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff; padding:14px 16px 14px; border-bottom:3px solid var(--rust);
  }
  header.top .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:#B9C6DE; margin:0 0 4px;}
  header.top h1{margin:0; font-size:18px; font-weight:700; letter-spacing:-.01em;}
  .crumb{display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px; flex-wrap:wrap;}
  .crumb button{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff;
    padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600;}
  .crumb .sep{color:#8FA0C0;}
  .crumb .now{color:#fff; font-weight:600;}
  .top-actions{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .pill-btn{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff;
    padding:5px 11px; border-radius:999px; font-size:11px; font-weight:600; display:flex; align-items:center; gap:5px;}
  .pill-btn svg{width:12px; height:12px;}
  .who{font-size:10.5px; color:#B9C6DE;}

  main{padding:16px 14px 28px; max-width:720px; margin:0 auto;}
  .view{display:none;}
  .view.active{display:block; animation:fadein .16s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  h2.sec{font-size:14px; font-weight:700; color:var(--navy); text-transform:uppercase;
    letter-spacing:.05em; margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
  h2.sec:first-child{margin-top:2px;}
  h2.sec .bar{width:4px; height:14px; background:var(--rust); border-radius:2px; display:inline-block;}
  h2.sec.green .bar{background:var(--green);}
  h2.sec.red .bar{background:var(--red);}

  .kpi-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .kpi-mini{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center;}
  .kpi-mini .v{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:17px; color:var(--navy);}
  .kpi-mini .l{font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin-top:2px;}

  .summary-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-top:14px; display:flex; justify-content:space-between; align-items:center;}
  .summary-card.resolved{border-left:5px solid var(--green);}
  .summary-card.unresolved{border-left:5px solid var(--red);}
  .summary-card .t{font-size:12.5px; font-weight:700; color:var(--ink);}
  .summary-card .n{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:700;}
  .summary-card.resolved .n{color:var(--green);}
  .summary-card.unresolved .n{color:var(--red);}
  .summary-card .sub{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px;}
  .chart-wrap{position:relative; height:220px;}

  .quad-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .quad{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; position:relative;
    overflow:hidden; text-align:left; width:100%; cursor:pointer;}
  .quad:active{transform:scale(.98);}
  .quad::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px;}
  .quad.resolved::before{background:var(--green);}
  .quad.unresolved::before{background:var(--rust);}
  .quad .name{font-size:11.5px; font-weight:700; color:var(--ink); margin-bottom:6px; padding-right:14px; line-height:1.25;}
  .quad .qtd{font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:700; color:var(--navy);}
  .quad .qtd small{font-size:10px; font-weight:500; color:var(--ink-soft);}
  .bar-bg{height:5px; background:var(--paper); border-radius:3px; margin:7px 0 5px; overflow:hidden;}
  .bar-fg{height:100%; border-radius:3px; background:var(--navy);}
  .quad .money{font-size:10px; color:var(--ink-soft); display:flex; justify-content:space-between;}
  .quad .money b{color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .quad .chev{position:absolute; right:10px; top:11px; color:var(--ink-soft); font-size:14px;}

  .client-list{display:flex; flex-direction:column; gap:8px;}
  .client-row{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px;
    width:100%; text-align:left; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .client-row:active{transform:scale(.99);}
  .client-row .name{font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.3;}
  .client-row .meta{font-size:10.5px; color:var(--ink-soft); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap;}
  .client-row .meta b{color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .aging-chip{font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:999px; white-space:nowrap;}
  .aging-chip.ok{background:var(--green-light); color:var(--green);}
  .aging-chip.warn{background:var(--rust-light); color:var(--rust);}
  .aging-chip.crit{background:var(--red-light); color:var(--red);}
  .chev-right{color:var(--ink-soft); font-size:16px; flex-shrink:0;}

  .search-box{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px; font-size:13px;
    margin-bottom:12px; background:var(--card); color:var(--ink);}
  .search-box:focus{outline:2px solid var(--rust); outline-offset:1px;}

  .client-header{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px;}
  .client-header h3{margin:0 0 10px; font-size:16px; color:var(--navy);}
  .client-header .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .client-header .field{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  .client-header .val{font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:600; color:var(--ink); margin-top:2px;}

  .timeline{position:relative; padding-left:18px;}
  .timeline::before{content:''; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--line);}
  .tl-item{position:relative; padding-bottom:16px;}
  .tl-item::before{content:''; position:absolute; left:-18px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--rust); border:2px solid #fff; box-shadow:0 0 0 1px var(--line);}
  .tl-item .date{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; color:var(--navy);}
  .tl-item .attendant{font-size:10.5px; color:var(--rust); font-weight:600; margin-left:8px;}
  .tl-item .obs{font-size:12px; color:var(--ink); margin-top:4px; line-height:1.45; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px;}

  .empty-state{text-align:center; padding:30px 20px; color:var(--ink-soft); font-size:13px;}
  .foot-note{font-size:11px; color:var(--ink-soft); line-height:1.5; margin-top:16px; text-align:center;}

  /* Gate / loading / error screens */
  .gate{min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 20px; text-align:center;}
  .gate .icon{font-size:40px; margin-bottom:14px;}
  .gate h2{font-size:17px; color:var(--navy); margin:0 0 8px;}
  .gate p{font-size:13px; color:var(--ink-soft); line-height:1.55; max-width:320px; margin:0 0 20px;}
  .ms-btn{background:var(--navy); color:#fff; border:none; padding:13px 22px; border-radius:10px; font-size:14px;
    font-weight:600; display:flex; align-items:center; gap:10px; cursor:pointer;}
  .ms-btn:active{opacity:.85;}
  .ms-logo{width:18px; height:18px; flex-shrink:0;}
  .spinner{width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--rust); border-radius:50%;
    animation:spin .8s linear infinite; margin-bottom:16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err-box{background:var(--red-light); border:1px solid #EFC3BC; color:#7A251C; border-radius:12px; padding:14px;
    font-size:12.5px; line-height:1.5; text-align:left; max-width:340px; margin-bottom:16px; word-break:break-word;}
  .retry-btn{background:var(--rust); color:#fff; border:none; padding:10px 20px; border-radius:10px; font-size:13px; font-weight:600;}
  .step{font-size:11.5px; color:var(--ink-soft); margin-top:16px;}
</style>
</head>
<body>

<header class="top">
  <p class="eyebrow">Painel de acompanhamento</p>
  <h1>Acompanhamento Repasses — Acqua</h1>
  <div class="crumb" id="crumb"></div>
  <div class="top-actions" id="topActions" style="display:none;">
    <span class="who" id="whoAmI"></span>
    <button class="pill-btn" id="refreshBtn">↻ Atualizar</button>
    <button class="pill-btn" id="logoutBtn">Sair</button>
  </div>
</header>

<main>
  <div class="view active" id="view-gate">
    <div class="gate" id="gateContent"></div>
  </div>
  <div class="view" id="view-panel"></div>
  <div class="view" id="view-group"></div>
  <div class="view" id="view-client"></div>
</main>

<script>
// =========================================================
// CONFIG
// =========================================================
const MSAL_CONFIG = {
  auth: {
    clientId: "b3905ec5-f74a-480c-bf41-4bd38b365ea4",
    authority: "https://login.microsoftonline.com/82c6cb9a-f136-4c23-9895-2221a3541a2d",
    redirectUri: window.location.origin + window.location.pathname,
  },
  cache: { cacheLocation: "sessionStorage", storeAuthStateInCookie: false },
};
const GRAPH_SCOPES = ["Files.Read", "Sites.Read.All"];
const SHAREPOINT_URL = "https://splengbr.sharepoint.com/:x:/s/splengenharia/IQA4ouX82iGDQaAFCU0KnnvDARi-hpgpOxD5YTLp_BpS9K8?e=ECy8uE";
const SHEET_PAINEL = "Painel Acompanhamento (3)";
const SHEET_ESTRATEGICO = "Acomp Estratégico";
const SHEET_ATENDIMENTOS = "Registro de atendimentos";

const PANEL_GROUPS = ['Quitado','Direto - Sem Correção','Safra - Safrinha','Financiaram','Em Financiamento','Acima 75%',
  'Boletos gerados para quitação','Aprovados - Aguardando Ok','Aprovados - Em Negociação  SPL','Em análise de Crédito',
  'Enviando simulação + Documentos','Sem contato','Permanecer Fluxo Direto','Pré Análise','Em Contato/negociação','Reprovados/Em distrato'];
const RESOLVIDOS_LABELS = ['Quitado','Direto - Sem Correção','Safra - Safrinha','Financiaram','Em Financiamento','Acima 75%'];

let msalInstance, account = null;
let DATA = null, CLIENTS = null, ATEND = null;
let STATE = { view:'gate', group:null, kind:null, client:null };

// =========================================================
// HELPERS
// =========================================================
function brl(n, dec=0){
  n = Number(n||0);
  const neg = n<0; n = Math.abs(n);
  return (neg?'-R$ ':'R$ ') + n.toLocaleString('pt-BR',{minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function brlCompact(n){
  n = Number(n||0);
  if (Math.abs(n) >= 1e6) return 'R$ ' + (n/1e6).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + 'M';
  if (Math.abs(n) >= 1e3) return 'R$ ' + (n/1e3).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}) + 'k';
  return brl(n);
}
function pct(n){ return (Number(n||0)*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%'; }
function numFmt(n){ return Number(n||0).toLocaleString('pt-BR'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').replace(/\s+/g,' ').trim().toLowerCase(); }
function agingClass(aging){
  const s = String(aging||'').trim();
  if (!s || s==='0') return 'ok';
  if (s.includes('>')){ const n = parseInt(s.replace(/\D/g,'')); if (n >= 60) return 'crit'; return 'warn'; }
  return 'ok';
}
function ptNum(v){
  if (typeof v === 'number') return v;
  if (!v) return 0;
  let s = String(v).replace('R$','').replace(/\xa0/g,' ').trim();
  if (!s) return 0;
  s = s.replace(/\./g,'').replace(',','.');
  s = s.replace(/[^0-9\.\-]/g,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function ptInt(v){
  if (typeof v === 'number') return Math.round(v);
  if (!v) return 0;
  const s = String(v).replace(/[^0-9\-]/g,'');
  return s ? parseInt(s) : 0;
}
function colIndex(header, ...names){
  for (const name of names){
    const i = header.findIndex(h => norm(h) === norm(name));
    if (i >= 0) return i;
  }
  for (const name of names){
    const key = norm(name).split(' ')[0];
    const i = header.findIndex(h => norm(h).startsWith(key));
    if (i >= 0) return i;
  }
  return -1;
}
function gateHtml({icon, title, body, extra=''}){
  return `<div class="icon">${icon}</div><h2>${title}</h2><p>${body}</p>${extra}`;
}
function setGate(html){ document.getElementById('gateContent').innerHTML = html; }

// =========================================================
// AUTH
// =========================================================
async function initAuth(){
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();

  try{
    const resp = await msalInstance.handleRedirectPromise();
    if (resp && resp.account) account = resp.account;
  } catch(e){
    showAuthError(e);
    return;
  }

  const accounts = msalInstance.getAllAccounts();
  if (!account && accounts.length > 0) account = accounts[0];

  if (account){
    msalInstance.setActiveAccount(account);
    document.getElementById('topActions').style.display = 'flex';
    document.getElementById('whoAmI').textContent = account.username || '';
    loadAllData();
  } else {
    showLoginScreen();
  }
}

function showLoginScreen(){
  setGate(gateHtml({
    icon:'🔐',
    title:'Entrar com sua conta Microsoft',
    body:'O dashboard busca os dados direto da planilha no SharePoint, com a sua permissão de acesso. Você usa seu login normal da SPL.',
    extra:`<button class="ms-btn" id="loginBtn">
      <svg class="ms-logo" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Entrar com Microsoft
    </button>`
  }));
  document.getElementById('loginBtn').addEventListener('click', doLogin);
}

async function doLogin(){
  try{
    setGate(gateHtml({icon:'⏳', title:'Abrindo login...', body:'Uma janela da Microsoft deve abrir.'}));
    const resp = await msalInstance.loginPopup({ scopes: GRAPH_SCOPES });
    account = resp.account;
    msalInstance.setActiveAccount(account);
    document.getElementById('topActions').style.display = 'flex';
    document.getElementById('whoAmI').textContent = account.username || '';
    loadAllData();
  } catch(e){
    showAuthError(e);
  }
}

async function getToken(){
  const req = { scopes: GRAPH_SCOPES, account };
  try{
    const res = await msalInstance.acquireTokenSilent(req);
    return res.accessToken;
  } catch(e){
    const res = await msalInstance.acquireTokenPopup(req);
    return res.accessToken;
  }
}

function showAuthError(e){
  setGate(gateHtml({
    icon:'⚠️',
    title:'Não consegui entrar',
    body:'Aconteceu um erro durante o login. Detalhe técnico abaixo — me manda print se for pedir ajuda.',
    extra:`<div class="err-box">${esc(e && e.message ? e.message : String(e))}</div>
      <button class="retry-btn" id="retryLoginBtn">Tentar de novo</button>`
  }));
  const btn = document.getElementById('retryLoginBtn');
  if (btn) btn.addEventListener('click', showLoginScreen);
}

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  msalInstance.logoutPopup().catch(()=>{});
});
document.getElementById('refreshBtn').addEventListener('click', ()=> loadAllData());

// =========================================================
// GRAPH DATA FETCH
// =========================================================
function encodeSharingUrl(url){
  const b64 = btoa(unescape(encodeURIComponent(url))).replace(/=/g,'').replace(/\//g,'_').replace(/\+/g,'-');
  return 'u!' + b64;
}

async function graphGet(url, token){
  const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok){
    const body = await res.text().catch(()=> '');
    throw new Error(`Graph API respondeu ${res.status} para ${url}\n${body.slice(0,300)}`);
  }
  return res.json();
}

async function loadAllData(){
  showView('gate');
  setGate(`<div class="spinner"></div><h2>Carregando dados...</h2><p id="loadStep" class="step">Conectando ao SharePoint...</p>`);
  const setStep = (t) => { const el = document.getElementById('loadStep'); if (el) el.textContent = t; };

  try{
    const token = await getToken();

    setStep('Localizando a planilha...');
    const shareId = encodeSharingUrl(SHAREPOINT_URL);
    const driveItem = await graphGet(`https://graph.microsoft.com/v1.0/shares/${shareId}/driveItem`, token);
    const driveId = driveItem.parentReference.driveId;
    const itemId = driveItem.id;
    const base = `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/workbook`;

    setStep('Lendo o painel...');
    const panelRange = await graphGet(`${base}/worksheets('${encodeURIComponent(SHEET_PAINEL)}')/range(address='D9:O71')`, token);
    DATA = parsePanel(panelRange.values);

    setStep('Lendo a carteira de clientes...');
    const estRange = await graphGet(`${base}/worksheets('${encodeURIComponent(SHEET_ESTRATEGICO)}')/usedRange(valuesOnly=true)`, token);
    CLIENTS = parseClients(estRange.values);

    setStep('Lendo histórico de atendimentos...');
    const atendRange = await graphGet(`${base}/worksheets('${encodeURIComponent(SHEET_ATENDIMENTOS)}')/usedRange(valuesOnly=true)`, token);
    ATEND = parseAtendimentos(atendRange.values);

    STATE = { view:'panel', group:null, kind:null, client:null };
    renderPanel();
    showView('panel');
  } catch(e){
    setGate(gateHtml({
      icon:'⚠️',
      title:'Não consegui carregar os dados',
      body:'Pode ser permissão faltando, o link do SharePoint mudou, ou nome de aba diferente. Detalhe técnico abaixo:',
      extra:`<div class="err-box">${esc(e && e.message ? e.message : String(e))}</div>
        <button class="retry-btn" id="retryLoadBtn">Tentar de novo</button>`
    }));
    const btn = document.getElementById('retryLoadBtn');
    if (btn) btn.addEventListener('click', loadAllData);
  }
}

// =========================================================
// PARSERS (mirroring the original Python extraction logic)
// =========================================================
function parsePanel(values){
  // values[0] corresponds to row 9 of the sheet (range starts at D9)
  const rowAt = (excelRow) => values[excelRow - 9] || [];
  const rd = (excelRow) => {
    const r = rowAt(excelRow);
    return {
      situacao: r[0] || '',       // D
      clientes: ptInt(r[2]),      // F
      pct: ptNum(r[3]),           // G (fraction, e.g. 0.569)
      valor_total: ptNum(r[5]),   // I
      valor_recebido: ptNum(r[7]),// K
      valor_a_receber: ptNum(r[9]),// M
    };
  };
  const header = rowAt(10);
  return {
    header: {
      unidades_totais: ptInt(header[0]), // D10
      permuta_terrenista: ptInt(header[2]), // F10
      vagas_garagem: ptInt(header[5]), // I10
      unidades_comercializadas: ptInt(header[7]), // K10
      estoque: ptInt(header[9]), // M10
      vendidas: ptInt(header[11]), // O10
    },
    resolvidos: [14,15,21,27,28,29].map(rd),
    resolvidos_total: rd(31),
    nao_resolvidos: [37,38,39,40,41,42,43,49,50,54].map(rd),
    nao_resolvidos_total: rd(59),
  };
}

function parseClients(values){
  const header = values[0];
  const iCliente = colIndex(header, 'Cliente');
  const iUnidade = colIndex(header, 'Unidade');
  const iSaldo = colIndex(header, 'A RECEBER');
  const iVenda = colIndex(header, 'Valor de venda bruto', 'Valor de venda');
  const iCca = colIndex(header, 'CCA');
  const iAging = colIndex(header, 'Aging Inadimplencia', 'Aging');
  const iGrupo = header.length - 1; // BV: last column, unlabeled helper — classification group

  const normToPanel = {};
  PANEL_GROUPS.forEach(g => normToPanel[norm(g)] = g);
  normToPanel[norm('Em Contato/Negociação')] = 'Em Contato/negociação';
  normToPanel[norm('Aprovados - Em Negociação')] = 'Aprovados - Em Negociação  SPL';

  const out = [];
  for (let r = 1; r < values.length; r++){
    const row = values[r];
    const cliente = row[iCliente];
    if (!cliente || !String(cliente).trim()) continue;
    const bv = row[iGrupo];
    out.push({
      cliente: String(cliente).trim(),
      unidade: row[iUnidade],
      grupo: normToPanel[norm(bv)] || null,
      saldo_devedor: ptNum(row[iSaldo]),
      valor_venda: ptNum(row[iVenda]),
      cca: row[iCca],
      aging: row[iAging],
    });
  }
  return out;
}

function parseAtendimentos(values){
  const header = values[0];
  const iUnid = colIndex(header, 'Unidades', 'Unidade');
  const iAtend = colIndex(header, 'Atendente');
  const iCca = colIndex(header, 'CCA');
  const iData = colIndex(header, 'Data');
  const iObs = colIndex(header, 'Observação');

  const out = {};
  const rows = [];
  for (let r = 1; r < values.length; r++){
    const row = values[r];
    const uni = row[iUnid];
    if (!uni || !String(uni).trim()) continue;
    let dataStr = row[iData];
    if (typeof dataStr === 'number'){
      // Excel serial date -> JS date (Excel epoch: 1899-12-30)
      const d = new Date(Math.round((dataStr - 25569) * 86400 * 1000));
      dataStr = d.toLocaleDateString('pt-BR', {timeZone:'UTC'});
    }
    rows.push({
      unidade: String(uni).trim(),
      data: dataStr || null,
      sortKey: typeof row[iData] === 'number' ? row[iData] : 0,
      atendente: row[iAtend] || row[iCca] || '',
      observacao: row[iObs] || '',
    });
  }
  rows.sort((a,b) => b.sortKey - a.sortKey);
  rows.forEach(r => {
    if (!out[r.unidade]) out[r.unidade] = [];
    out[r.unidade].push({ data: r.data, atendente: r.atendente, observacao: r.observacao });
  });
  return out;
}
</script>

<script id="ui-logic">
// =========================================================
// VIEW 1: PANEL
// =========================================================
function quadHtml(item, kind){
  const recPct = item.valor_total > 0 ? (item.valor_recebido / item.valor_total) * 100 : 0;
  return `<button class="quad ${kind}" data-group="${esc(item.situacao)}" data-kind="${kind}">
    <span class="chev">›</span>
    <div class="name">${esc(item.situacao)}</div>
    <div class="qtd">${numFmt(item.clientes)} <small>cliente${item.clientes===1?'':'s'} · ${pct(item.pct)}</small></div>
    <div class="bar-bg"><div class="bar-fg" style="width:${recPct.toFixed(1)}%; background:${kind==='resolved'?'var(--green)':'var(--rust)'}"></div></div>
    <div class="money"><span>Recebido <b>${brlCompact(item.valor_recebido)}</b></span></div>
    <div class="money"><span>A receber <b>${brlCompact(item.valor_a_receber)}</b></span></div>
  </button>`;
}

function renderPanel(){
  const h = DATA.header;
  const rt = DATA.resolvidos_total;
  const nt = DATA.nao_resolvidos_total;
  const totalClientes = rt.clientes + nt.clientes;

  const html = `
  <h2 class="sec"><span class="bar"></span>Panorama do empreendimento</h2>
  <div class="kpi-strip">
    <div class="kpi-mini"><div class="v">${numFmt(h.unidades_totais)}</div><div class="l">Unidades totais</div></div>
    <div class="kpi-mini"><div class="v">${numFmt(h.vendidas)}</div><div class="l">Vendidas</div></div>
    <div class="kpi-mini"><div class="v">${numFmt(h.estoque)}</div><div class="l">Estoque</div></div>
  </div>

  <h2 class="sec"><span class="bar"></span>Carteira em acompanhamento</h2>
  <div class="card"><div class="chart-wrap"><canvas id="mainChart"></canvas></div></div>
  <div class="summary-card resolved">
    <div><div class="t">✅ Resolvidos</div><div class="sub">${numFmt(rt.clientes)} clientes de ${numFmt(totalClientes)} (${pct(rt.pct)})</div></div>
    <div style="text-align:right"><div class="n">${brlCompact(rt.valor_a_receber)}</div><div class="sub">a receber</div></div>
  </div>
  <div class="summary-card unresolved">
    <div><div class="t">⚠️ Não resolvidos</div><div class="sub">${numFmt(nt.clientes)} clientes de ${numFmt(totalClientes)} (${pct(nt.pct)})</div></div>
    <div style="text-align:right"><div class="n">${brlCompact(nt.valor_a_receber)}</div><div class="sub">a receber</div></div>
  </div>

  <h2 class="sec green"><span class="bar"></span>Resolvidos — toque para ver os clientes</h2>
  <div class="quad-grid">${DATA.resolvidos.map(i=>quadHtml(i,'resolved')).join('')}</div>

  <h2 class="sec red"><span class="bar"></span>Não resolvidos — toque para ver os clientes</h2>
  <div class="quad-grid">${DATA.nao_resolvidos.map(i=>quadHtml(i,'unresolved')).join('')}</div>
  <p class="foot-note">Dados ao vivo do SharePoint · classificação por grupo principal (sub-etapas internas não exibidas nesta versão).</p>
  `;
  document.getElementById('view-panel').innerHTML = html;

  document.querySelectorAll('.quad').forEach(btn=>{
    btn.addEventListener('click', ()=> goToGroup(btn.dataset.group, btn.dataset.kind));
  });

  if (window._chart) window._chart.destroy();
  window._chart = new Chart(document.getElementById('mainChart'), {
    type:'doughnut',
    data:{ labels:['Resolvidos', 'Não resolvidos'],
      datasets:[{ data:[rt.valor_a_receber, nt.valor_a_receber], backgroundColor:['#4C7A3D','#C55A11'], borderWidth:2, borderColor:'#fff' }] },
    options:{ maintainAspectRatio:false,
      plugins:{ legend:{position:'bottom', labels:{boxWidth:11, font:{size:11, family:'IBM Plex Sans'}}},
        tooltip:{ callbacks:{ label:(ctx)=> ` ${ctx.label}: ${brl(ctx.parsed)}` } } } }
  });
}

// =========================================================
// VIEW 2: GROUP -> CLIENT LIST
// =========================================================
function goToGroup(group, kind){
  STATE = { view:'group', group, kind, client:null };
  renderGroup();
  showView('group');
}

function clientRowHtml(c){
  const ac = agingClass(c.aging);
  return `<button class="client-row" data-unidade="${esc(c.unidade)}">
    <div style="flex:1; min-width:0;">
      <div class="name">${esc(c.cliente)}</div>
      <div class="meta">
        <span>Un. <b>${esc(c.unidade)}</b></span>
        <span>Saldo <b>${brlCompact(c.saldo_devedor)}</b></span>
        <span>Venda <b>${brlCompact(c.valor_venda)}</b></span>
        ${c.cca ? `<span>CCA: ${esc(c.cca)}</span>` : ''}
        ${c.aging ? `<span class="aging-chip ${ac}">Aging: ${esc(c.aging)}</span>` : ''}
      </div>
    </div>
    <span class="chev-right">›</span>
  </button>`;
}

function renderGroup(){
  const clients = CLIENTS.filter(c => c.grupo === STATE.group);
  const kindLabel = STATE.kind === 'resolved' ? 'Resolvidos' : 'Não resolvidos';

  const html = `
  <h2 class="sec ${STATE.kind==='resolved'?'green':'red'}"><span class="bar"></span>${esc(STATE.group)}</h2>
  <p class="foot-note" style="margin-top:0; text-align:left;">${kindLabel} · ${clients.length} cliente${clients.length===1?'':'s'}</p>
  <input type="text" class="search-box" id="clientSearch" placeholder="Buscar cliente ou unidade...">
  <div class="client-list" id="clientListWrap">${clients.map(clientRowHtml).join('') || '<div class="empty-state">Nenhum cliente neste grupo.</div>'}</div>
  `;
  document.getElementById('view-group').innerHTML = html;
  wireClientRows();

  document.getElementById('clientSearch').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    const filtered = clients.filter(c => c.cliente.toLowerCase().includes(q) || String(c.unidade).toLowerCase().includes(q));
    document.getElementById('clientListWrap').innerHTML = filtered.map(clientRowHtml).join('') || '<div class="empty-state">Nenhum resultado.</div>';
    wireClientRows();
  });
}

function wireClientRows(){
  document.querySelectorAll('.client-row').forEach(btn=>{
    btn.addEventListener('click', ()=> goToClient(btn.dataset.unidade));
  });
}

// =========================================================
// VIEW 3: CLIENT -> ATENDIMENTOS TIMELINE
// =========================================================
function goToClient(unidade){
  const client = CLIENTS.find(c => String(c.unidade) === unidade);
  STATE.view = 'client'; STATE.client = client;
  renderClient();
  showView('client');
}

function renderClient(){
  const c = STATE.client;
  const hist = (ATEND[c.unidade] || []);
  const ac = agingClass(c.aging);

  const html = `
  <div class="client-header">
    <h3>${esc(c.cliente)}</h3>
    <div class="grid2">
      <div><div class="field">Unidade</div><div class="val">${esc(c.unidade)}</div></div>
      <div><div class="field">Grupo</div><div class="val" style="font-size:11.5px">${esc(c.grupo)}</div></div>
      <div><div class="field">Saldo devedor</div><div class="val">${brl(c.saldo_devedor)}</div></div>
      <div><div class="field">Valor de venda</div><div class="val">${brl(c.valor_venda)}</div></div>
      <div><div class="field">CCA</div><div class="val">${c.cca ? esc(c.cca) : '—'}</div></div>
      <div><div class="field">Aging inadimplência</div><div class="val"><span class="aging-chip ${ac}">${c.aging!=null && c.aging!=='' ? esc(c.aging) : '—'}</span></div></div>
    </div>
  </div>

  <h2 class="sec"><span class="bar"></span>Histórico de atendimentos (${hist.length})</h2>
  <div class="timeline">
    ${hist.length ? hist.map(a=>`
      <div class="tl-item">
        <span class="date">${esc(a.data)||'sem data'}</span><span class="attendant">${esc(a.atendente)}</span>
        <div class="obs">${esc(a.observacao)||'<em>sem observação</em>'}</div>
      </div>`).join('') : '<div class="empty-state">Nenhum atendimento registrado para essa unidade.</div>'}
  </div>
  `;
  document.getElementById('view-client').innerHTML = html;
}

// =========================================================
// NAVIGATION
// =========================================================
function showView(name){
  STATE.view = name;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});
  renderCrumb();
}

function renderCrumb(){
  const crumb = document.getElementById('crumb');
  if (STATE.view === 'gate' || STATE.view === 'panel'){ crumb.innerHTML = ''; return; }
  if (STATE.view === 'group'){
    crumb.innerHTML = `<button id="crumbPanel">Painel</button><span class="sep">/</span><span class="now">${esc(STATE.group)}</span>`;
    document.getElementById('crumbPanel').addEventListener('click', ()=> showView('panel'));
    return;
  }
  if (STATE.view === 'client'){
    crumb.innerHTML = `<button id="crumbPanel">Painel</button><span class="sep">/</span><button id="crumbGroup">${esc(STATE.group)}</button><span class="sep">/</span><span class="now">${esc(STATE.client.cliente.split(' ').slice(0,2).join(' '))}</span>`;
    document.getElementById('crumbPanel').addEventListener('click', ()=> showView('panel'));
    document.getElementById('crumbGroup').addEventListener('click', ()=> showView('group'));
    return;
  }
}

initAuth();
</script>
